apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeops-api
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubeops-api
  template:
    metadata:
      labels:
        app: kubeops-api
    spec:
      containers:
        - name: kubeops-api
          image: kubeops-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
